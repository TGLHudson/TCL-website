# Jekyll configuration for thecultureladder.com, built by GitHub Pages.
# Same approach as hudsonriskculture.com (the Risk-culture repository).
title: The Culture Ladder
description: >-
  The Culture Ladder by Tim Hudson (CRC Press, February 2027). A safe
  organisation is one whose culture fits the risk it runs.
lang: en-GB
url: "https://thecultureladder.com"
baseurl: ""
markdown: kramdown
kramdown:
  input: GFM
  auto_ids: true
plugins:
  - jekyll-sitemap
exclude:
  - README.md
  - CLAUDE.md
  - STYLE.md
  - Gemfile
  - Gemfile.lock
  - docs/
  - vendor/

# Launch-day switches. Leave empty until each exists.
# preorder_url: the CRC Press product page. Turns the "Get notified" buttons into pre-order buttons.
preorder_url:
# mailing_list: the provider's form address, the email field name it expects, and a one-line privacy notice.
mailing_list:
  action:
  field: email
  privacy:

# The book's ISBN, once CRC Press issues it.
book:
  isbn:

# Sharing and search
title_suffix: The Culture Ladder by Tim Hudson
share_image: /assets/share-card.png
author:
  name: Tim Hudson
  url: https://thecultureladder.com/author/
  same_as:
    - https://www.linkedin.com/in/tgl-hudson
    - https://hudsonriskculture.com

# Main navigation, in order. Edit here to add or reorder pages.
nav:
  - title: Home
    url: /
  - title: The book
    url: /book/
  - title: Papers
    url: /papers/
  - title: Consulting
    url: /consulting/
  - title: The author
    url: /author/
  - title: Contact
    url: /contact/

# Footer site list: the menu plus pages linked only from the footer.
footer_nav:
  - title: Home
    url: /
  - title: The book
    url: /book/
  - title: Papers
    url: /papers/
  - title: References
    url: /references/
  - title: Consulting
    url: /consulting/
  - title: The author
    url: /author/
  - title: Contact
    url: /contact/
